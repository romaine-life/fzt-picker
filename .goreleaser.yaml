# The Go programs this repository releases (the Rust ones build through cargo):
# pipeline-templates' release suite runs `goreleaser build` on this file
# (PIPT-31) and keeps version numbering, upload, home-sync and pins itself; the
# ldflags stamp the VERSION, GITHUB_REPOSITORY and GITHUB_SERVER_URL it sets.
version: 2

project_name: fzt-picker

builds:
  - &build
    id: fzt-picker-frontend
    main: ./cmd/fzt-picker-frontend
    binary: "fzt-picker-frontend{{ if ne .Os \"windows\" }}-{{ .Os }}-{{ .Arch }}{{ end }}"
    targets: [windows_amd64_v1, darwin_arm64_v8.0]
    no_unique_dist_dir: true
    env: [CGO_ENABLED=0]
    flags: [-p=4, -trimpath]
    ldflags: >-
      -s -w
      {{ if isEnvSet "VERSION" }}-X main.version={{ .Env.VERSION }}{{ end }}
      {{ if isEnvSet "GITHUB_REPOSITORY" }}-X main.buildRepo={{ .Env.GITHUB_REPOSITORY }}{{ end }}
      {{ if isEnvSet "GITHUB_SERVER_URL" }}-X main.buildServer={{ .Env.GITHUB_SERVER_URL }}{{ end }}
      -X main.buildTime={{ .Now.UTC.Format "2006-01-02T15:04:05.000Z" }}

  - <<: *build
    id: fzt-files
    main: ./cmd/fzt-files
    binary: fzt-files
    targets: [windows_amd64_v1]

  # The frontend DLL the hook loads; cgo links it, so it builds on Windows.
  - <<: *build
    id: frontend-dll
    main: ./cmd/frontend-dll
    binary: fzt_picker_frontend
    targets: [windows_amd64_v1]
    buildmode: c-shared
    env: [CGO_ENABLED=1]
