name: Dependency Update

# Run by hand: bumps fzt and fzt-terminal in frontend/go.mod, cuts a release
# and runs build.yml with the new tag.

on:
  workflow_dispatch:

concurrency:
  # Shared with release.yml so tag-cutting is serialized.
  group: release-tag
  cancel-in-progress: false

jobs:
  update:
    uses: romaine-life/pipeline-templates/.forgejo/workflows/go-dependency-update-template.yml@main
    secrets: inherit
    with:
      go-mod-path: frontend
      modules: github.com/romaine-life/fzt github.com/romaine-life/fzt-terminal
      # Leaf with binary artifacts (Rust + Go): release, no downstream
      # dispatch, then build.yml with the new tag builds and uploads.
      artifact-build-workflow: build.yml
