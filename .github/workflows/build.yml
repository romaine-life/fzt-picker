name: Build

# Called by the dep-update template AFTER it cuts a release. Builds the
# Rust COM hook + injector + Go CGo DLL + standalone frontend for the
# given tag, plus the standalone frontend for macOS (arm64) and Linux (amd64), and uploads
# all assets to the existing release. Every pull
# request runs the same build without the upload, so a release is never
# the first build of a change.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build artifacts for (and upload to)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # ── Rust (COM hook + injector + test-trigger) ──────────────
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: rust-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: rust-
      - name: Build Rust binaries
        shell: bash
        working-directory: windows
        run: cargo build --release

      # ── Go (CGo DLL + standalone frontend) ─────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version-file: frontend/go.mod
          cache-dependency-path: frontend/go.sum

      - uses: actions/cache@v4
        id: msys2-cache
        with:
          path: C:\msys64\ucrt64
          key: msys2-ucrt64-gcc
      - name: Install MinGW GCC
        if: steps.msys2-cache.outputs.cache-hit != 'true'
        shell: bash
        run: C:/msys64/usr/bin/pacman.exe -S --noconfirm mingw-w64-ucrt-x86_64-gcc

      - name: Build CGo DLL
        shell: bash
        working-directory: frontend
        env:
          CGO_ENABLED: "1"
          CC: C:\msys64\ucrt64\bin\gcc.exe
        run: go build -buildmode=c-shared -o fzt_picker_frontend.dll ./cgo

      - name: Vet
        shell: bash
        working-directory: frontend
        run: go vet . ./picker

      - name: Test
        shell: bash
        working-directory: frontend
        run: go test ./picker

      - name: Build standalone frontend
        shell: bash
        working-directory: frontend
        env:
          CGO_ENABLED: "0"
        run: go build -o fzt-picker-frontend.exe .

      # Defender quarantined an unsigned tmux build as Program:Win32/Contebrew.A!ml
      # and passed the same build signed (TMUX-30). The certificate is at
      # Terminal's, which every home PC trusts.
      - name: Sign
        shell: pwsh
        env:
          PFX: ${{ secrets.AT_TERMINAL_PFX }}
          PFX_PASSWORD: ${{ secrets.AT_TERMINAL_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX) { throw 'AT_TERMINAL_PFX is not set' }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          [IO.File]::WriteAllBytes("$PWD\cert.pfx", [Convert]::FromBase64String($env:PFX))
          try {
            & $signtool.FullName sign /fd SHA256 /f cert.pfx /p $env:PFX_PASSWORD `
              windows/target/release/fzt_picker_hook.dll `
              windows/target/release/fzt-picker.exe `
              windows/target/release/test-trigger.exe `
              frontend/fzt_picker_frontend.dll `
              frontend/fzt-picker-frontend.exe
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally { Remove-Item cert.pfx }

      # ── Upload to existing release ─────────────────────────────
      - name: Upload assets to release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ inputs.tag }} \
            windows/target/release/fzt_picker_hook.dll \
            windows/target/release/fzt-picker.exe \
            windows/target/release/test-trigger.exe \
            frontend/fzt_picker_frontend.dll \
            frontend/fzt-picker-frontend.exe \
            --clobber \
            -R ${{ github.repository }}

  # The standalone frontend for the work Mac (launch-claude in a tmux pane).
  # The COM hook and popup DLL are Windows-only.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: frontend/go.mod
          cache-dependency-path: frontend/go.sum

      - name: Vet
        working-directory: frontend
        run: go vet . ./picker

      - name: Test
        working-directory: frontend
        run: go test ./picker

      - name: Build standalone frontend
        working-directory: frontend
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: go build -o fzt-picker-frontend-darwin-arm64 .

      - name: Upload asset to release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ inputs.tag }} \
            frontend/fzt-picker-frontend-darwin-arm64 \
            --clobber \
            -R ${{ github.repository }}

  # The standalone frontend for the work Linux machine (launch-claude in a tmux pane).
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: frontend/go.mod
          cache-dependency-path: frontend/go.sum

      - name: Vet
        working-directory: frontend
        run: go vet . ./picker

      - name: Test
        working-directory: frontend
        run: go test ./picker

      - name: Build standalone frontend
        working-directory: frontend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -o fzt-picker-frontend-linux-amd64 .

      - name: Upload asset to release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ inputs.tag }} \
            frontend/fzt-picker-frontend-linux-amd64 \
            --clobber \
            -R ${{ github.repository }}
